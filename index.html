<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Portfolio | Maria Perezolova</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lakki+Reddy&family=Love+Ya+Like+A+Sister&family=Life+Savers:wght@400;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #24365F;
            font-family: 'Lakki Reddy', cursive;
            overflow-x: hidden;
        }

        .portfolio-container {
            position: relative;
            width: 100%;
            max-width: 1920px;
            margin: 0 auto;
            background: #24365F;
            min-height: 100vh;
        }

        /* ========== ШАПКА ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 44px 90px 0 90px;
            flex-wrap: wrap;
            position: relative;
            z-index: 30;
        }

        .logo {
            font-family: 'Love Ya Like A Sister', cursive;
            font-size: 96px;
            color: #FFFA67;
            white-space: nowrap;
        }

        /* ========== НАВИГАЦИЯ ========== */
        .nav-links {
            display: flex;
            gap: 30px;
            background: rgba(0,0,0,0.3);
            padding: 10px 30px;
            border-radius: 50px;
            backdrop-filter: blur(3.5px);
            margin-top: 20px;
        }

        .nav-links a {
            font-family: 'Lakki Reddy', cursive;
            font-size: 36px;
            color: #FFFA67;
            text-decoration: none;
            padding: 8px 25px;
            border-radius: 30px;
            background: #616FD0;
            transition: transform 0.2s, background 0.2s;
            display: inline-block;
        }

        .nav-links a:nth-child(2) { background: #24318E; }
        .nav-links a:hover {
            transform: scale(1.05);
            background: #7a88e8;
        }

        /* ========== СОЦСЕТИ В ШАПКЕ ========== */
        .social-header {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 20px;
        }

        .social-header div {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .social-header div:hover { transform: scale(1.1); }

        /* ========== КАРТОЧКИ ========== */
        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin: 100px auto 60px;
            padding: 0 40px;
            max-width: 1400px;
        }

        .card {
            width: 452px;
            height: 302px;
            border-radius: 90px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Lakki Reddy', cursive;
            font-size: 48px;
            background-size: cover;
        }
        .card:hover { transform: scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }

        .card-1 { background: linear-gradient(135deg, #3a4b7a, #1a2a4a); color: #FFFA67; text-shadow: 0 4px 4px #FFFA67; }
        .card-2 { background: linear-gradient(135deg, #4a5b8a, #2a3a5a); color: #FFFA67; }
        .card-3 { background: linear-gradient(135deg, #5a6b9a, #3a4a6a); color: #28007E; text-shadow: 0 4px 4px #488CCB; }
        .card-4 { background: linear-gradient(135deg, #6a7baa, #4a5a7a); color: #28007E; }

        .card-1::before { content: "Theatre"; }
        .card-2::before { content: "Stage collections"; font-size: 38px; }
        .card-3::before { content: "Graphics"; }
        .card-4::


before { content: "Accessories"; }

        /* ========== ПОДВАЛ (ВСЁ В СТОЛБИК) ========== */
        .footer {
            background: rgba(17,20,48,0.9);
            backdrop-filter: blur(10px);
            margin-top: 80px;
            padding: 40px 80px;
            border-top: 5px solid #616FD0;
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-section {
            text-align: center;
        }

        .footer-section h3 {
            font-family: 'Life Savers', serif;
            font-weight: 800;
            font-size: 28px;
            color: #616FD0;
            margin-bottom: 15px;
        }

        .footer-section p {
            font-family: 'Life Savers', serif;
            font-weight: 800;
            font-size: 20px;
            color: #616FD0;
            line-height: 1.6;
        }

        /* ========== ИКОНКИ ТЕМЫ В ПОДВАЛЕ ========== */
        .theme-icons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }
        .theme-icons div {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .theme-icons div:hover { transform: scale(1.1); }

        /* ========== АДАПТИВНОСТЬ ========== */
        max-width: 1400px {
            .header { padding: 30px 40px 0 40px; flex-direction: column; text-align: center; gap: 20px; }
            .logo { white-space: normal; font-size: 70px; }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 15px; }
            .nav-links a { font-size: 28px; padding: 5px 20px; }
            .social-header { justify-content: center; }
            .card { width: 380px; height: 260px; border-radius: 70px; font-size: 40px; }
            .card-2::before { font-size: 32px; }
            .footer { padding: 30px 20px; }
            .footer-section h3 { font-size: 24px; }
            .footer-section p { font-size: 18px; }
        }

        max-width: 900px {
            .cards-grid { gap: 20px; padding: 0 20px; margin-top: 60px; }
            .card { width: 100%; max-width: 380px; height: 240px; border-radius: 60px; font-size: 36px; }
            .card-2::before { font-size: 28px; }
            .footer-section h3 { font-size: 22px; }
            .footer-section p { font-size: 16px; }
        }

        max-width: 600px {
            .logo { font-size: 48px; }
            .nav-links a { font-size: 22px; padding: 5px 15px; }
            .social-header svg { width: 28px; height: 28px; }
            .card { height: 200px; border-radius: 50px; font-size: 30px; }
            .card-2::before { font-size: 24px; }
            .footer-section h3 { font-size: 20px; }
            .footer-section p { font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="portfolio-container">
    <!-- ШАПКА: ЛОГО слева, СОЦСЕТИ справа -->
    <div class="header">
        <div class="logo">LOGO</div>

                    <polygon points="9.75 8.5 9.75 15.5 15.5 12 9.75 8.5" fill="#FFFA67"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Portfolio</a>
        <a href="#">About me</a>
        <a href="#">Contacts</a>
    </div>

    <!-- КАРТОЧКИ -->
    <div class="cards-grid">
        <div class="card card-1" onclick="alert('Theatre — скоро подробнее')"></div>
        <div class="card card-2" onclick="alert('Stage collections — скоро подробнее')"></div>
        <div class="card card-3" onclick="alert('Graphics — скоро подробнее')"></div>
        <div class="card card-4" onclick="alert('Accessories — скоро подробнее')"></div>
    </div>

    <!-- ПОДВАЛ (ВСЁ В СТОЛБИК) -->
    <div class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>Types of work</h3>
                <p>Fashion illustration
Digital graphics

            </div>
            <div class="footer-section">
                <h3>Use programs</h3>
                <p>CorelDraw

ClipStudio

            </div>
            <div class="theme-icons">
                <div onclick="alert('Светлая тема в разработке')">
                    <svg width="44" height="43" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="5" stroke="#616FD0" stroke-width="3" fill="none"/>
                        <path d="M12 2V4M12 20V22M4 12H2M6 6L4 4M18 18L20 20M22 12H20M18 6L20 4M6 18L4 20" stroke="#616FD0" stroke-width="3"/>

                <div onclick="alert('Тёмная тема уже активна')">
                    <svg width="45" height="43" viewBox="0 0 24 24" fill="none">

                    </svg>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.nav-links a').forEach(anchor => {
        anchor.addEventListener('click', function(e) {
            e.preventDefault();
            const targetId = this.textContent.toLowerCase().replace(' ', '');
            alert(`Страница "${this.textContent}" в разработке`);
        });
    });
</script>
</body>
</html>
